services:

  postgres:
    image: postgres:18
    container_name: expense-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql
    networks:
      - expense-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # local .env sets DB_SSLMODE=disable (local postgres has no SSL);
  # EC2's .env sets it to require (RDS enforces SSL). Was previously
  # hardcoded to "disable" here, which broke every EC2 deploy.
  employee-app:
    environment:
      DB_SSLMODE: ${DB_SSLMODE}

  manager-app:
    environment:
      DB_SSLMODE: ${DB_SSLMODE}


  # Collects the metrics
  prometheus:
    image: prom/prometheus
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      # if you edit this file on a Mac and prometheus then dies with
      # "resource deadlock avoided", macOS stuck a com.apple.provenance
      # attribute on it. Fix with:  xattr -c prometheus.yml
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - expense-network

  # Draws the graphs
  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - expense-network


networks:
  expense-network:

volumes:
  pgdata: