services:

  manager-app:
    build:
      context: ./manager-app
    container_name: manager-app
    ports:
      - "8080:8080"
    volumes:
      # matches -Dexpense.db.path in manager-app/Dockerfile
      - ./database:/app/database
    restart: unless-stopped

  employee-app:
    build:
      context: ./employee-app
    container_name: employee-app
    ports:
      - "5001:5001"
    volumes:
      # db/connection.py resolves ../../database relative to WORKDIR /app,
      # which lands at /database in the container
      - ./database:/database
    restart: unless-stopped
