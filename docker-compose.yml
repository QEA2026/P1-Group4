services:

  manager-app:
    build:
      context: ./manager-app
    container_name: manager-app
    ports:
      - "8080:8080"
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    networks:
      - expense-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  employee-app:
    build:
      context: ./employee-app
    container_name: employee-app
    ports:
      - "5001:5001"
    environment:
      DB_TYPE: postgres
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    networks:
      - expense-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

networks:
  expense-network:
